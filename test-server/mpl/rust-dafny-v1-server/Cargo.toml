[package]
name = "aws-mpl-dafny-test-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hand-rolled rpcv2Cbor Language_Server for the MPL TestServer, delegating to the Dafny-generated Rust MaterialProviders client."

[[bin]]
name = "mpl-test-server"
path = "src/main.rs"

[dependencies]
aws-mpl-legacy = { path = "../../../releases/rust/mpl" }
# The key store takes KMS and DynamoDB clients. Same versions as releases/rust/mpl,
# so these resolve to the crates aws-mpl-legacy wraps.
aws-config = "1.8.12"
aws-sdk-dynamodb = "1.103.0"
aws-sdk-kms = "1.98.0"
aws-smithy-types = "1.3.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["v4"] }
