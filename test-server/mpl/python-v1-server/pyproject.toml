[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl-test-server-python"
version = "0.0.0"
description = "Hand-implemented Python Language_Server for the MPL TestServer (rpcv2Cbor)"
requires-python = ">=3.11"
# The Material Providers Library (aws-cryptographic-material-providers and its
# internal dependencies) is installed from this repo's Dafny-transpiled
# AwsCryptographicMaterialProviders/runtimes/python source, not from PyPI. Only
# the wire-protocol codec is declared here.
dependencies = [
    "cbor2>=5.6",
]

[project.scripts]
mpl-test-server-python = "mpl_test_server.__main__:main"

[tool.setuptools]
packages = ["mpl_test_server"]
