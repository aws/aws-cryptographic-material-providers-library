[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primitives-test-server-python"
version = "0.0.0"
description = "Hand-implemented Python Language_Server for the Primitives TestServer (rpcv2Cbor)"
requires-python = ">=3.11"
# The AtomicPrimitives library (aws-cryptography-internal-primitives and its
# aws-cryptography-internal-standard-library dependency) is installed from this
# repo's Dafny-transpiled AwsCryptographyPrimitives/runtimes/python source, not
# from PyPI. Only the wire-protocol codec is declared here.
dependencies = [
    "cbor2>=5.6",
]

[project.scripts]
primitives-test-server-python = "primitives_test_server.__main__:main"

[tool.setuptools]
packages = ["primitives_test_server"]
