# The single declaration of every version the TestServer's Gradle builds use.
#
# The TestServer is four INDEPENDENT Gradle builds (model, client-java,
# servers/java, tests, plus orchestrator), each with its own settings file. Gradle
# only reads `gradle.properties` from a build's own root, so without this file each
# build would carry its own copy of these versions and they would drift. Every
# module's `settings.gradle.kts` and `build.gradle.kts` loads THIS file instead.
#
# The smithy-java CODEGEN version and the smithy-java RUNTIME version must stay in
# lockstep: the generated sources and the runtime they compile against are one unit.
smithyGradleVersion=1.4.0
smithyJavaVersion=1.4.0

# Must match the pin the model's own smithy-build.json uses, so the
# `smithy.protocols#rpcv2Cbor` trait resolves identically during codegen.
smithyProtocolTraitsVersion=1.58.0

# JUnit 5 hosts the conformance and meta suites.
junitVersion=5.11.3

# Jackson parses the Configuration_Set in the orchestrator.
jacksonVersion=2.18.2

# The Java toolchain every TestServer module compiles with. smithy-java 1.x
# baselines on Java 21.
javaToolchainVersion=21
