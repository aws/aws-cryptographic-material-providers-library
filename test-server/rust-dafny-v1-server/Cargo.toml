[package]
name = "aws-primitives-dafny-test-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hand-rolled rpcv2Cbor Language_Server for the Primitives TestServer, delegating to the Dafny-generated Rust AtomicPrimitives client."

[[bin]]
name = "primitives-test-server"
path = "src/main.rs"

[dependencies]
aws-mpl-legacy = { path = "../../releases/rust/mpl" }
aws-smithy-types = "1.3.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
