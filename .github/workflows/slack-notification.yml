name: Slack Notification
on:
  workflow_call:
    inputs:
      message:
        required: true
        type: string
        description: "Message to send to Slack"
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
        description: "Slack webhook URL"

permissions:
  contents: read

jobs:
  notify:
    runs-on: codebuild-CryptoToolsCI-linux-aws-cryptographic-material-providers-library-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Send message to Slack
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {"message": "${{ inputs.message }}"}
          webhook-type: webhook-trigger
