# This workflow performs tests in Python using pre-built artifacts.
name: Library Python tests

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean

jobs:
  buildPython:
    uses: ./.github/workflows/library_python_build.yml
    with:
      dafny: ${{ inputs.dafny }}
      regenerate-code: ${{ inputs.regenerate-code }}

  testPython:
    needs: buildPython
    strategy:
      fail-fast: false
      matrix:
        library:
          [
            StandardLibrary,
            AwsCryptographyPrimitives,
            ComAmazonawsKms,
            ComAmazonawsDynamodb,
            AwsCryptographicMaterialProviders,
            TestVectorsAwsCryptographicMaterialProviders,
          ]
        python-version: ["3.11", "3.13"]
        # TODO fix Dafny-generated tests on Windows;
        # the sys.path workaround for generated Dafny doesn't work on Windows.
        # Note: only tests use the sys.path workaround, not source code.
        # Windows source code is tested downstream (ex. ESDK-Python CI).
        # windows-latest,
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-MPL-Dafny-Role-us-west-2
          role-session-name: PythonTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - uses: actions/checkout@v6
      - run: git submodule update --init libraries
      - run: git submodule update --init --recursive smithy-dafny

      - run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download transpiled Python source
        uses: actions/download-artifact@v8
        with:
          name: python-transpiled-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: .

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox
          pip install poetry

      # The test server dashboard merges this run's line coverage, line by
      # line, with the coverage the Python test server gives the same commit.
      # tox passes only AWS_* to its environments, so the overrides let
      # pytest-cov and its options in.
      - name: Turn on line coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.13' && (matrix.library == 'AwsCryptographicMaterialProviders' || matrix.library == 'AwsCryptographyPrimitives') && (github.event_name == 'pull_request' || github.event_name == 'push')
        run: |
          mkdir -p "$RUNNER_TEMP/local-coverage"
          echo "TOX_OVERRIDE=testenv.deps=pytest-cov==6.0.0;testenv.passenv+=PYTEST_ADDOPTS,COVERAGE_FILE" >> "$GITHUB_ENV"
          echo "COVERAGE_FILE=$RUNNER_TEMP/local-coverage/.coverage" >> "$GITHUB_ENV"
          echo "PYTEST_ADDOPTS=--cov=src --cov-append --cov-report=lcov:$RUNNER_TEMP/local-coverage/python.lcov" >> "$GITHUB_ENV"
          case "${{ matrix.library }}" in
            AwsCryptographicMaterialProviders) echo "LOCAL_COVERAGE=mpl" >> "$GITHUB_ENV" ;;
            AwsCryptographyPrimitives) echo "LOCAL_COVERAGE=primitives" >> "$GITHUB_ENV" ;;
          esac

      - name: Test ${{ matrix.library }}
        working-directory: ./${{ matrix.library }}
        run: |
          make test_python

      # Paths are made relative to the repository so the two reports line up.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        run: |
          python3 .github/scripts/coverage_lcov.py lcov \
            "$RUNNER_TEMP/local-coverage/python.lcov" "$RUNNER_TEMP/local-coverage/$LOCAL_COVERAGE-python.lcov" \
            --base ${{ matrix.library }}/runtimes/python

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-${{ env.LOCAL_COVERAGE }}-python
          path: ${{ runner.temp }}/local-coverage/${{ env.LOCAL_COVERAGE }}-python.lcov
          if-no-files-found: warn
