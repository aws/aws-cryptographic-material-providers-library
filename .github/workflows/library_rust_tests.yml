# This workflow performs tests in Rust using pre-built artifacts.
name: Library Rust tests

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean

jobs:
  buildRust:
    uses: ./.github/workflows/library_rust_build.yml
    with:
      dafny: ${{ inputs.dafny }}
      regenerate-code: ${{ inputs.regenerate-code }}

  testRust:
    needs: buildRust
    strategy:
      fail-fast: false
      matrix:
        library:
          [
            StandardLibrary,
            ComAmazonawsDynamodb,
            ComAmazonawsKms,
            AwsCryptographyPrimitives,
            AwsCryptographicMaterialProviders,
            TestVectorsAwsCryptographicMaterialProviders,
          ]
        # removed windows-latest because somehow it can't build aws-lc in CI
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    env:
      RUST_MIN_STACK: 404857600
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Init Submodules
        shell: bash
        run: |
          git submodule update --init libraries
          git submodule update --init --recursive smithy-dafny

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-MPL-Dafny-Role-us-west-2
          role-session-name: RustTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Setup Rust Toolchain for GitHub CI
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      # Go is needed for aws-lc-FIPS
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.18"

      - run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download generated Rust source
        uses: actions/download-artifact@v8
        with:
          name: rust-generated-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: .

      # The test server dashboard merges the debug test run's line coverage,
      # line by line, with the coverage the rust-dafny test servers give the
      # same commit.
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux' && matrix.library == 'AwsCryptographicMaterialProviders' && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Turn on line coverage
        if: runner.os == 'Linux' && matrix.library == 'AwsCryptographicMaterialProviders' && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          mkdir -p "$RUNNER_TEMP/local-coverage"
          echo "LOCAL_COVERAGE=mpl" >> "$GITHUB_ENV"

      - name: Test ${{ matrix.library }} Rust
        shell: bash
        working-directory: ./${{ matrix.library }}/runtimes/rust
        run: |
          cargo test --release -- --nocapture
          if [ -n "${LOCAL_COVERAGE:-}" ]; then
            source <(cargo llvm-cov show-env --sh)
          fi
          cargo test -- --nocapture

      # The MPL and Primitives rust-dafny test servers both run the committed
      # crate under releases/rust/mpl, so a file is named by that copy when the
      # two are identical.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        shell: bash
        working-directory: ./${{ matrix.library }}/runtimes/rust
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/local-coverage/rust.lcov"
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage_lcov.py" lcov \
            "$RUNNER_TEMP/local-coverage/rust.lcov" "$RUNNER_TEMP/local-coverage/mpl-rust-dafny.lcov" \
            --keep ${{ matrix.library }}/runtimes/rust/ \
            --release-copy ${{ matrix.library }}/runtimes/rust/=releases/rust/mpl/

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-mpl-rust-dafny
          path: ${{ runner.temp }}/local-coverage/mpl-rust-dafny.lcov
          if-no-files-found: warn

      - name: Upload the line coverage report for the Primitives
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-primitives-rust-dafny
          path: ${{ runner.temp }}/local-coverage/mpl-rust-dafny.lcov
          if-no-files-found: warn

      - name: Test ${{ matrix.library }} Rust Fips
        if: matrix.library == 'AwsCryptographyPrimitives' || matrix.library == 'AwsCryptographicMaterialProviders' || matrix.library == 'TestVectorsAwsCryptographicMaterialProviders'
        shell: bash
        working-directory: ./${{ matrix.library }}/runtimes/rust
        run: |
          cargo test --release --features fips -- --nocapture
          cargo test --features fips -- --nocapture
