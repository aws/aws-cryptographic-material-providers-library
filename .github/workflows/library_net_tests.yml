# This workflow performs tests in .NET using pre-built artifacts.
name: Library net tests

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean

jobs:
  buildNet:
    uses: ./.github/workflows/library_net_build.yml
    with:
      dafny: ${{ inputs.dafny }}
      regenerate-code: ${{ inputs.regenerate-code }}

  testDotNet:
    needs: buildNet
    strategy:
      fail-fast: false
      matrix:
        library:
          [
            StandardLibrary,
            AwsCryptographyPrimitives,
            ComAmazonawsKms,
            ComAmazonawsDynamodb,
            AwsCryptographicMaterialProviders,
            TestVectorsAwsCryptographicMaterialProviders,
          ]
        dotnet-version: ["6.0.x"]
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-MPL-Dafny-Role-us-west-2
          role-session-name: NetTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - uses: actions/checkout@v6
      - run: git submodule update --init libraries
      - run: git submodule update --init --recursive smithy-dafny

      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Setup .NET OpenSSL on Mac
        if: matrix.os == 'macos-15'
        run: |
          brew install openssl@3
          echo "DYLD_LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV
          echo "DOTNET_SYSTEM_SECURITY_CRYPTOGRAPHY_OPENSSL_OVERRIDE_VERSION_CHECK=1" >> $GITHUB_ENV
          echo "DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER=0" >> $GITHUB_ENV

      - run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download transpiled source
        uses: actions/download-artifact@v8
        with:
          name: net-transpiled-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: .

      - name: Download Dependencies
        working-directory: ./${{ matrix.library }}
        run: make setup_net

      # The test server dashboard merges this run's line coverage, line by
      # line, with the coverage the .NET test server gives the same commit.
      - name: Setup .NET 8 for dotnet-coverage
        if: runner.os == 'Linux' && (matrix.library == 'AwsCryptographicMaterialProviders' || matrix.library == 'AwsCryptographyPrimitives') && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Turn on line coverage
        if: runner.os == 'Linux' && (matrix.library == 'AwsCryptographicMaterialProviders' || matrix.library == 'AwsCryptographyPrimitives') && (github.event_name == 'pull_request' || github.event_name == 'push')
        run: |
          mkdir -p "$RUNNER_TEMP/local-coverage"
          dir="$RUNNER_TEMP/dotnet-coverage"
          dotnet tool install dotnet-coverage --version 18.12.0 --tool-path "$dir"
          echo "DOTNET_COVERAGE=$dir/dotnet-coverage" >> "$GITHUB_ENV"
          echo "DOTNET_COVERAGE_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_COVERAGE_NOLOGO=1" >> "$GITHUB_ENV"
          case "${{ matrix.library }}" in
            AwsCryptographicMaterialProviders) echo "LOCAL_COVERAGE=mpl" >> "$GITHUB_ENV" ;;
            AwsCryptographyPrimitives) echo "LOCAL_COVERAGE=primitives" >> "$GITHUB_ENV" ;;
          esac

      - name: Test ${{ matrix.library }} .NET net6.0
        working-directory: ./${{ matrix.library }}
        shell: bash
        run: |
          if [ -n "${DOTNET_COVERAGE:-}" ]; then
            "$DOTNET_COVERAGE" collect --output-format cobertura \
              --output "$RUNNER_TEMP/local-coverage/net.cobertura.xml" \
              -- dotnet run --project runtimes/net/tests/ --framework net6.0
          else
            dotnet run --project runtimes/net/tests/ --framework net6.0
          fi

      # Paths are made relative to the repository so the two reports line up.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        run: |
          python3 .github/scripts/coverage_lcov.py cobertura \
            "$RUNNER_TEMP/local-coverage/net.cobertura.xml" "$RUNNER_TEMP/local-coverage/$LOCAL_COVERAGE-net.lcov" \
            --keep ${{ matrix.library }}/runtimes/net/ --drop ${{ matrix.library }}/runtimes/net/tests/

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-${{ env.LOCAL_COVERAGE }}-net
          path: ${{ runner.temp }}/local-coverage/${{ env.LOCAL_COVERAGE }}-net.lcov
          if-no-files-found: warn

      - name: Test Cache Thread Safety net6.0
        if: matrix.library == 'AwsCryptographicMaterialProviders'
        working-directory: ./${{ matrix.library }}
        shell: bash
        run: |
          dotnet restore runtimes/net/tests/LocalCMC.Tests/
          dotnet build runtimes/net/tests/LocalCMC.Tests/
          dotnet test runtimes/net/tests/LocalCMC.Tests/ \
              --framework net6.0

      - name: Test Cache Thread Safety .NET Framework net48
        if: matrix.os == 'windows-latest' && matrix.library == 'AwsCryptographicMaterialProviders'
        working-directory: ./${{ matrix.library }}
        shell: bash
        run: |
          dotnet restore runtimes/net/tests/LocalCMC.Tests/
          dotnet build runtimes/net/tests/LocalCMC.Tests/
          dotnet test runtimes/net/tests/LocalCMC.Tests/ \
              --framework net48
