# This workflow performs tests in Java using pre-built artifacts.
name: Library Java tests

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean

jobs:
  buildJava:
    uses: ./.github/workflows/library_java_build.yml
    with:
      dafny: ${{ inputs.dafny }}
      regenerate-code: ${{ inputs.regenerate-code }}

  testJava:
    needs: buildJava
    strategy:
      fail-fast: false
      matrix:
        library:
          [
            AwsCryptographyPrimitives,
            ComAmazonawsKms,
            ComAmazonawsDynamodb,
            AwsCryptographicMaterialProviders,
            StandardLibrary,
          ]
        os: [ubuntu-22.04, macos-latest]
        java-versions: [8, 11, 17, 19, 21]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true

      - name: Configure AWS Credentials for Tests
        uses: aws-actions/configure-aws-credentials@v6
        if: matrix.library == 'ComAmazonawsKms' || matrix.library == 'ComAmazonawsDynamodb' || matrix.library == 'AwsCryptographicMaterialProviders' || matrix.library == 'TestVectorsAwsCryptographicMaterialProviders'
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-MPL-Dafny-Role-us-west-2
          role-session-name: JavaTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - uses: actions/checkout@v6
      - run: git submodule update --init libraries
      - run: git submodule update --init --recursive smithy-dafny

      - run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download Maven local repository
        uses: actions/download-artifact@v8
        with:
          name: java-maven-local-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: ~/.m2/repository/software/amazon/

      - name: Download transpiled source
        uses: actions/download-artifact@v8
        with:
          name: java-transpiled-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: .

      - name: Setup Java 8, for complex reasons
        if: ${{matrix.java-versions != 8 }}
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: 8

      - name: Setup Java ${{ matrix.java-versions }}
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: ${{ matrix.java-versions }}

      # The test server dashboard merges this run's line coverage, line by
      # line, with the coverage the Java test server gives the same commit.
      # The init script runs every test JVM with the JaCoCo agent.
      - name: Turn on line coverage
        if: runner.os == 'Linux' && matrix.java-versions == 17 && (matrix.library == 'AwsCryptographicMaterialProviders' || matrix.library == 'AwsCryptographyPrimitives') && (github.event_name == 'pull_request' || github.event_name == 'push')
        env:
          JACOCO_VERSION: 0.8.13
        run: |
          dir="$RUNNER_TEMP/jacoco"
          mkdir -p "$dir" "$RUNNER_TEMP/local-coverage" ~/.gradle/init.d
          base=https://repo1.maven.org/maven2/org/jacoco
          curl -sSfL -o "$dir/jacocoagent.jar" "$base/org.jacoco.agent/$JACOCO_VERSION/org.jacoco.agent-$JACOCO_VERSION-runtime.jar"
          curl -sSfL -o "$dir/jacococli.jar" "$base/org.jacoco.cli/$JACOCO_VERSION/org.jacoco.cli-$JACOCO_VERSION-nodeps.jar"
          printf '%s  %s\n' \
            47e700ccb0fdb9e27c5241353f8161938f4e53c3561dd35e063c5fe88dc3349b jacocoagent.jar \
            8f748683833d4dc4d72cea5d6b43f49344687b831e0582c97bcb9b984e3de0a3 jacococli.jar \
            | (cd "$dir" && sha256sum -c -)
          agent="-javaagent:$dir/jacocoagent.jar=destfile=$dir/jacoco.exec,append=true"
          cat > ~/.gradle/init.d/local-coverage.gradle <<EOF
          allprojects {
              tasks.withType(JavaExec).configureEach { jvmArgs '$agent' }
              tasks.withType(Test).configureEach { jvmArgs '$agent' }
          }
          EOF
          case "${{ matrix.library }}" in
            AwsCryptographicMaterialProviders) echo "LOCAL_COVERAGE=mpl" >> "$GITHUB_ENV" ;;
            AwsCryptographyPrimitives) echo "LOCAL_COVERAGE=primitives" >> "$GITHUB_ENV" ;;
          esac

      - name: Test ${{ matrix.library }} on ${{ matrix.java-versions }}
        working-directory: ./${{ matrix.library }}/runtimes/java
        run: |
          ./gradlew runTests
          ./gradlew test --info

      # Paths are made relative to the repository so the two reports line up.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        run: |
          java -jar "$RUNNER_TEMP/jacoco/jacococli.jar" report "$RUNNER_TEMP/jacoco/jacoco.exec" \
            --classfiles ${{ matrix.library }}/runtimes/java/build/classes/java/main \
            --xml "$RUNNER_TEMP/local-coverage/jacoco.xml"
          args=()
          for root in ${{ matrix.library }}/runtimes/java/src/main/*/; do
            args+=(--source-root "$root")
          done
          python3 .github/scripts/coverage_lcov.py jacoco \
            "$RUNNER_TEMP/local-coverage/jacoco.xml" "$RUNNER_TEMP/local-coverage/$LOCAL_COVERAGE-java.lcov" "${args[@]}"

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-${{ env.LOCAL_COVERAGE }}-java
          path: ${{ runner.temp }}/local-coverage/${{ env.LOCAL_COVERAGE }}-java.lcov
          if-no-files-found: warn
