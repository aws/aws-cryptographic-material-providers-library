# Cross-language MPL TestServer run, from the shared workflow in
# aws-crypto-tools-commons. This checkout supplies the Dafny-runtime servers
# (java, net, python, go, rust-dafny); the native rust server comes from its
# configured branch in aws-crypto-tools-rust.
name: MPL TestServer

on:
  pull_request:
    paths:
      - "test-server/mpl/**"
      - "AwsCryptographicMaterialProviders/**"
      - "releases/go/mpl/**"
      - "releases/rust/mpl/**"
      - ".github/workflows/mpl-test-server.yml"
  push:
    branches:
      - main
    paths:
      - "test-server/mpl/**"
      - "AwsCryptographicMaterialProviders/**"
      - "releases/go/mpl/**"
      - "releases/rust/mpl/**"
      - ".github/workflows/mpl-test-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # The reusable workflow's test job assumes this repository's CI role through
  # GitHub OIDC, for the hierarchical keyring Tests.
  id-token: write
  # Its resolve job reads this pull request's Test-Server-Override lines.
  pull-requests: read

jobs:
  test-server:
    name: TestServer
    uses: aws/aws-crypto-tools-commons/.github/workflows/mpl-test-server-reusable.yml@main
    with:
      checkout-languages: java,net,python,go,rust-dafny
    secrets:
      repo-pat: ${{ secrets.AWS_CRYPTO_TOOLS_REPO }}
