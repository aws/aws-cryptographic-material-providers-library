# This workflow performs tests in Go using pre-built artifacts.
name: Library Go tests

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean

jobs:
  buildGo:
    uses: ./.github/workflows/library_go_build.yml
    with:
      dafny: ${{ inputs.dafny }}
      regenerate-code: ${{ inputs.regenerate-code }}

  testGo:
    needs: buildGo
    strategy:
      fail-fast: false
      matrix:
        library:
          [
            StandardLibrary,
            ComAmazonawsKms,
            ComAmazonawsDynamodb,
            AwsCryptographyPrimitives,
            AwsCryptographicMaterialProviders,
            TestVectorsAwsCryptographicMaterialProviders,
          ]
        go-version: ["1.24", "1.25"]
        # TODO fix Dafny-generated tests on Windows;
        # the sys.path workaround for generated Dafny doesn't work on Windows.
        # Note: only tests use the sys.path workaround, not source code.
        # Windows source code is tested downstream (ex. ESDK-Python CI).
        # windows-latest,
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-MPL-Dafny-Role-us-west-2
          role-session-name: GoTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - uses: actions/checkout@v6
      - run: git submodule update --init libraries
      - run: git submodule update --init --recursive smithy-dafny

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - run: echo "TIMESTAMP=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Download generated Go source
        uses: actions/download-artifact@v8
        with:
          name: go-generated-${{ env.TIMESTAMP }}-${{ matrix.os }}-${{ github.sha }}
          path: .

      # The test server dashboard merges this run's line coverage, line by
      # line, with the coverage the Go test server gives the same commit.
      - name: Turn on line coverage
        if: runner.os == 'Linux' && matrix.go-version == '1.25' && (matrix.library == 'AwsCryptographicMaterialProviders' || matrix.library == 'AwsCryptographyPrimitives') && (github.event_name == 'pull_request' || github.event_name == 'push')
        run: |
          mkdir -p "$RUNNER_TEMP/local-coverage/gocover"
          case "${{ matrix.library }}" in
            AwsCryptographicMaterialProviders) echo "LOCAL_COVERAGE=mpl" >> "$GITHUB_ENV" ;;
            AwsCryptographyPrimitives) echo "LOCAL_COVERAGE=primitives" >> "$GITHUB_ENV" ;;
          esac

      - name: Test ${{ matrix.library }}
        working-directory: ./${{ matrix.library }}
        run: |
          if [ -n "${LOCAL_COVERAGE:-}" ]; then
            # `go run TestsFromDafny.go` names its main package
            # command-line-arguments; a -cover binary whose main package is
            # not covered writes no counters.
            module=$(awk '/^module /{print $2}' runtimes/go/ImplementationFromDafny-go/go.mod)
            export GOFLAGS="-cover -coverpkg=$module/...,command-line-arguments"
            export GOCOVERDIR="$RUNNER_TEMP/local-coverage/gocover"
          fi
          make test_go

      # The Go test servers run the committed copy under releases/go/, so a
      # file is named by that copy when the two are identical.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        run: |
          python3 .github/scripts/coverage_lcov.py go \
            "$RUNNER_TEMP/local-coverage/gocover" "$RUNNER_TEMP/local-coverage/$LOCAL_COVERAGE-go.lcov" \
            --module-dir ${{ matrix.library }}/runtimes/go/ImplementationFromDafny-go \
            --keep ${{ matrix.library }}/runtimes/go/ImplementationFromDafny-go/ \
            --release-copy ${{ matrix.library }}/runtimes/go/ImplementationFromDafny-go/=releases/go/$LOCAL_COVERAGE/

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-${{ env.LOCAL_COVERAGE }}-go
          path: ${{ runner.temp }}/local-coverage/${{ env.LOCAL_COVERAGE }}-go.lcov
          if-no-files-found: warn

      # This is only to test AwsCryptographicMaterialProviders which has local cmc test inside it.
      - name: Test local CMC
        if: matrix.library == 'AwsCryptographicMaterialProviders'
        working-directory: ./${{ matrix.library }}/runtimes/go/TestsFromDafny-go
        run: |
          go test
